name: Live demo

# Publishes the reference view with a sample home and the sky switcher to
# GitHub Pages. It is a static build: no runtime, no Home Assistant, no token.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build the demo
        run: npm run build:demo
        env:
          HOMEFRAME_BASE: /${{ github.event.repository.name }}/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dashboard/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
