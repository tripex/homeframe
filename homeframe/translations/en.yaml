configuration:
  allow_control:
    name: Allow controls
    description: >-
      Let dashboards switch lights, set climate targets and start or dock a
      vacuum. Locks, alarms and garage doors can never be changed from
      Homeframe, whatever this is set to.
  locale:
    name: Language
    description: >-
      Language of the dashboards Homeframe creates by itself (en or da).
      Other dashboards keep their own setting.
  regenerate_dashboard:
    name: Regenerate dashboard
    description: >-
      Rebuild every template dashboard (home-tablet, home-desktop and other
      template dashboards) from its current template on every start, e.g.
      after an update. Turn it off again afterwards to keep your own edits.
      Dashboards made by an agent or by hand are never touched.
