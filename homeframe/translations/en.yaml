configuration:
  allow_control:
    name: Allow controls
    description: >-
      Let dashboards switch lights, set climate targets and start or dock a
      vacuum. Locks, alarms and garage doors can never be changed from
      Homeframe, whatever this is set to.
  locale:
    name: Language
    description: >-
      Language of the dashboard created on first start (en or da). Existing
      dashboards keep their own setting.
  regenerate_dashboard:
    name: Regenerate dashboard
    description: >-
      Rebuild the auto-created home-tablet dashboard from the current template
      on every start, e.g. after an update. Turn it off again afterwards to
      keep your own edits. Other dashboards are never touched.
